services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudweave}
      POSTGRES_USER: ${POSTGRES_USER:-cloudweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudweave}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: [CMD, pg_isready, -U, cloudweave, -d, cloudweave]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  order-service:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cloudweave}
      DB_USERNAME: ${POSTGRES_USER:-cloudweave}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cloudweave}
    ports:
      - ${ORDER_SERVICE_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres-data:
