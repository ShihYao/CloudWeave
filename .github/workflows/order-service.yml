name: Order Service CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: order-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: cloudweave-learning-order-service
  ECS_CLUSTER: cloudweave-learning-order
  ECS_SERVICE: cloudweave-learning-order
  CONTAINER_NAME: order-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and package
        run: mvn -B clean verify

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "665116832947"
          role-session-name: cloudweave-${{ github.run_id }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Register image-only task definition revision
        run: |
          current="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)"
          aws ecs describe-task-definition --task-definition "$current" --query taskDefinition --output json > current.json
          jq --arg image "$IMAGE_URI" --arg name "$CONTAINER_NAME" 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) | .containerDefinitions |= map(if .name == $name then .image = $image else . end)' current.json > deploy.json
          arn="$(aws ecs register-task-definition --cli-input-json file://deploy.json --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "TASK_DEFINITION_ARN=$arn" >> "$GITHUB_ENV"
      - name: Deploy and verify
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$TASK_DEFINITION_ARN" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 "${{ vars.ALB_BASE_URL }}/actuator/health"
